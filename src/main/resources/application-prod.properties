# ========================
# PROD (RDS MySQL / ECS)
# ========================

# DataSource (환경변수 주입)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP (기본 튜닝)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT_MS:20000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# 운영 안전: 기본은 validate 권장
# 단, 처음 1회 스키마 생성이 필요하면 아래 값을 update로 바꿔서 1회 실행 후 다시 validate로 돌리기
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# JWT (환경변수)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS (환경변수)
spring.web.cors.allowed-origins=${ALLOWED_ORIGINS}
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Actuator (헬스체크용)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# Logging
logging.level.root=INFO
logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.orm.jdbc.bind=off
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=off